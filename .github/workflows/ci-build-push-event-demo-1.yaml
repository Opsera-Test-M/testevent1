# ════════════════════════════════════════════════════════════════════════════
# CI/CD WORKFLOW - event-demo-1
# Generated by Opsera Code-to-Cloud Enterprise v0.903
# ════════════════════════════════════════════════════════════════════════════

name: "🚀 event-demo-1: CI Build & Push"

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.html'
      - '.opsera-event-demo-1/Dockerfile'
      - '.opsera-event-demo-1/nginx.conf'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: string
        default: 'dev'
      image_tag:
        description: 'Use existing image tag (skip build)'
        type: string
        required: false

# Prevent concurrent runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: event-demo-1
  TENANT: opsera
  AWS_REGION: us-west-2
  DOMAIN: agent.opsera.dev

permissions:
  contents: write
  id-token: write
  security-events: write

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # VERIFY BOOTSTRAP
  # ════════════════════════════════════════════════════════════════════════════
  verify-bootstrap:
    name: "🔍 Verify Bootstrap"
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      ecr_uri: ${{ steps.check.outputs.ecr_uri }}
      account_id: ${{ steps.check.outputs.account_id }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
      skip_build: ${{ steps.tag.outputs.skip_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ENV="dev"
          else
            ENV="${{ inputs.environment }}"
          fi
          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          echo "📍 Target environment: ${ENV}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # RULE 10: Verify bootstrap completed
      - name: Check Prerequisites
        id: check
        run: |
          # Get AWS Account ID
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT

          ECR_URI="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          echo "ecr_uri=${ECR_URI}" >> $GITHUB_OUTPUT

          # Check ECR repository exists
          ECR_REPO="${{ env.TENANT }}/${{ env.APP_NAME }}"
          if ! aws ecr describe-repositories --repository-names "$ECR_REPO" 2>/dev/null; then
            echo "❌ ECR repository not found: $ECR_REPO"
            echo "Run bootstrap workflow first:"
            echo "  gh workflow run 00-bootstrap-infrastructure-${{ env.APP_NAME }}.yaml -f proceed=true"
            exit 1
          fi
          
          echo "✅ ECR repository exists"

      - name: Determine Image Tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "image_tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "skip_build=true" >> $GITHUB_OUTPUT
            echo "📦 Using existing image: ${{ inputs.image_tag }}"
          else
            SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            TAG="${SHORT_SHA}-${TIMESTAMP}"
            echo "image_tag=${TAG}" >> $GITHUB_OUTPUT
            echo "skip_build=false" >> $GITHUB_OUTPUT
            echo "🏷️ New image tag: ${TAG}"
          fi

  # ════════════════════════════════════════════════════════════════════════════
  # SECURITY SCANNING (Parallel with build)
  # ════════════════════════════════════════════════════════════════════════════
  security-scan:
    name: "🔐 Security Scan"
    runs-on: ubuntu-latest
    needs: [verify-bootstrap]
    if: needs.verify-bootstrap.outputs.skip_build == 'false'
    continue-on-error: true  # RULE 78: Non-blocking
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # L454: Full history for Gitleaks

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Grype SCA Scan
        uses: anchore/scan-action@v3
        id: grype
        continue-on-error: true
        with:
          path: "."
          fail-build: false
          severity-cutoff: critical
          output-format: sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}

  # ════════════════════════════════════════════════════════════════════════════
  # BUILD AND PUSH
  # ════════════════════════════════════════════════════════════════════════════
  build-and-push:
    name: "🔨 Build & Push"
    runs-on: ubuntu-latest
    needs: [verify-bootstrap]
    if: needs.verify-bootstrap.outputs.skip_build == 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .opsera-${{ env.APP_NAME }}/Dockerfile
          push: true
          tags: |
            ${{ needs.verify-bootstrap.outputs.ecr_uri }}/${{ env.TENANT }}/${{ env.APP_NAME }}:${{ needs.verify-bootstrap.outputs.image_tag }}
            ${{ needs.verify-bootstrap.outputs.ecr_uri }}/${{ env.TENANT }}/${{ env.APP_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Image Summary
        run: |
          echo "### 🐳 Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ needs.verify-bootstrap.outputs.ecr_uri }}/${{ env.TENANT }}/${{ env.APP_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${{ needs.verify-bootstrap.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY

  # ════════════════════════════════════════════════════════════════════════════
  # UPDATE MANIFESTS
  # ════════════════════════════════════════════════════════════════════════════
  update-manifests:
    name: "📝 Update Manifests"
    runs-on: ubuntu-latest
    needs: [verify-bootstrap, build-and-push, security-scan]
    # RULE 42: Use always() for downstream jobs
    if: always() && needs.verify-bootstrap.result == 'success' && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # RULE 8: Git pull before file modification
      - name: Pull Latest
        run: git pull --rebase origin main

      - name: Update Kustomization
        run: |
          ENV="${{ needs.verify-bootstrap.outputs.environment }}"
          TAG="${{ needs.verify-bootstrap.outputs.image_tag }}"
          KUSTOMIZE_FILE=".opsera-${{ env.APP_NAME }}/k8s/overlays/${ENV}/kustomization.yaml"
          
          # Update image tag
          sed -i "s/newTag: .*/newTag: ${TAG}/" "$KUSTOMIZE_FILE"
          
          echo "✅ Updated ${KUSTOMIZE_FILE} with tag: ${TAG}"
          cat "$KUSTOMIZE_FILE"

      - name: Commit and Push
        run: |
          ENV="${{ needs.verify-bootstrap.outputs.environment }}"
          TAG="${{ needs.verify-bootstrap.outputs.image_tag }}"
          
          git add .opsera-${{ env.APP_NAME }}/k8s/overlays/${ENV}/kustomization.yaml
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "deploy(${ENV}): Update ${{ env.APP_NAME }} to ${TAG} [skip ci]

Environment: ${ENV}
Image Tag: ${TAG}
Triggered by: ${{ github.actor }}

Co-Authored-By: Opsera Code-to-Cloud <noreply@opsera.io>"
            
            git push origin main
            echo "✅ Manifest updated"
          fi

  # ════════════════════════════════════════════════════════════════════════════
  # MONITOR DEPLOYMENT
  # ════════════════════════════════════════════════════════════════════════════
  monitor-deployment:
    name: "📊 Monitor Deployment"
    runs-on: ubuntu-latest
    needs: [verify-bootstrap, update-manifests]
    if: always() && needs.update-manifests.result == 'success'
    outputs:
      deploy_success: ${{ steps.wait.outputs.success }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          # Configure for spoke cluster
          SPOKE_CLUSTER="opsera-usw2-np"
          aws eks update-kubeconfig --name $SPOKE_CLUSTER --region ${{ env.AWS_REGION }}

      # RULE 66: Force ArgoCD sync
      - name: Trigger ArgoCD Sync
        run: |
          # Configure for hub cluster
          HUB_CLUSTER="argocd-usw2"
          aws eks update-kubeconfig --name $HUB_CLUSTER --region ${{ env.AWS_REGION }} --alias hub
          kubectl config use-context hub
          
          APP="${{ env.APP_NAME }}-${{ needs.verify-bootstrap.outputs.environment }}"
          
          kubectl annotate application "$APP" -n argocd \
            argocd.argoproj.io/refresh=hard --overwrite || true
          
          echo "✅ ArgoCD sync triggered"

      - name: Wait for Deployment
        id: wait
        run: |
          ENV="${{ needs.verify-bootstrap.outputs.environment }}"
          NAMESPACE="${{ env.TENANT }}-${{ env.APP_NAME }}-${ENV}"
          
          # Configure for spoke cluster
          SPOKE_CLUSTER="opsera-usw2-np"
          aws eks update-kubeconfig --name $SPOKE_CLUSTER --region ${{ env.AWS_REGION }}
          
          # RULE 43: Environment-aware timeouts
          case "$ENV" in
            dev) TIMEOUT=300 ;;
            qa|staging) TIMEOUT=600 ;;
            *) TIMEOUT=300 ;;
          esac
          
          echo "⏳ Waiting for deployment (timeout: ${TIMEOUT}s)..."
          
          ELAPSED=0
          INTERVAL=15
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            # Check if pods exist and are ready
            PODS=$(kubectl get pods -n "$NAMESPACE" -l app=${{ env.APP_NAME }} --no-headers 2>/dev/null || echo "")
            
            if [ -n "$PODS" ]; then
              READY=$(echo "$PODS" | grep -c "Running" || echo "0")
              TOTAL=$(echo "$PODS" | wc -l | tr -d ' ')
              
              echo "Pods: $READY/$TOTAL running (${ELAPSED}s elapsed)"
              
              if [ "$READY" -gt 0 ] && [ "$READY" -eq "$TOTAL" ]; then
                echo "✅ All pods running!"
                echo "success=true" >> $GITHUB_OUTPUT
                exit 0
              fi
            else
              echo "Waiting for pods... (${ELAPSED}s elapsed)"
            fi
            
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          
          # L450: Always set output
          echo "⚠️ Deployment timed out (${TIMEOUT}s)"
          echo "success=false" >> $GITHUB_OUTPUT

  # ════════════════════════════════════════════════════════════════════════════
  # SUMMARY
  # ════════════════════════════════════════════════════════════════════════════
  summary:
    name: "📋 Deployment Summary"
    runs-on: ubuntu-latest
    needs: [verify-bootstrap, build-and-push, security-scan, update-manifests, monitor-deployment]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          ENV="${{ needs.verify-bootstrap.outputs.environment }}"
          TAG="${{ needs.verify-bootstrap.outputs.image_tag }}"
          SUBDOMAIN="${{ env.TENANT }}-${{ env.APP_NAME }}-${ENV}.${{ env.DOMAIN }}"
          
          cat << EOF >> $GITHUB_STEP_SUMMARY
          # 🚀 Deployment Summary: ${{ env.APP_NAME }}

          ## Configuration
          | Setting | Value |
          |---------|-------|
          | **App Name** | \`${{ env.APP_NAME }}\` |
          | **Environment** | \`${ENV}\` |
          | **Image Tag** | \`${TAG}\` |
          | **Triggered By** | \`${{ github.actor }}\` |

          ## Pipeline Status
          | Stage | Status |
          |-------|--------|
          | Verify Bootstrap | ${{ needs.verify-bootstrap.result }} |
          | Security Scan | ${{ needs.security-scan.result }} |
          | Build & Push | ${{ needs.build-and-push.result }} |
          | Update Manifests | ${{ needs.update-manifests.result }} |
          | Monitor Deployment | ${{ needs.monitor-deployment.result }} |

          ## Application URL
          \`\`\`
          https://${SUBDOMAIN}
          \`\`\`

          ## Next Steps
          - **Monitor ArgoCD** for sync status
          - **Promote to QA**: 
            \`\`\`bash
            gh workflow run ci-build-push-${{ env.APP_NAME }}.yaml -f environment=qa -f image_tag=${TAG}
            \`\`\`

          ---
          *Generated by Opsera Code-to-Cloud Enterprise v0.903*
          EOF
