# ════════════════════════════════════════════════════════════════════════════
# GITOPS SETUP WORKFLOW (One-Time)
# Generated by Opsera Code-to-Cloud Enterprise v0.903
# 
# This workflow runs ONCE to:
# 1. Resolve AWS Account ID
# 2. Update kustomization files with ECR URI
# 3. Create ECR repository if needed
# 4. Create ArgoCD repo secret
# 5. Apply ArgoCD Applications
#
# After this runs, pure GitOps takes over - no more GHA needed!
# ════════════════════════════════════════════════════════════════════════════

name: "🔧 event-demo-1: GitOps Setup (One-Time)"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        type: choice
        options:
          - dev
          - all
        default: dev
      hub_cluster:
        description: 'ArgoCD Hub Cluster'
        type: string
        default: 'argocd-usw2'
      spoke_cluster:
        description: 'Spoke Cluster for workloads'
        type: string
        default: 'opsera-usw2-np'

env:
  APP_NAME: event-demo-1
  TENANT: opsera
  AWS_REGION: us-west-2

permissions:
  contents: write
  id-token: write

jobs:
  setup:
    name: "🔧 GitOps Setup"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID
        id: aws
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT
          echo "✅ AWS Account ID: ${ACCOUNT_ID}"

      - name: Create ECR Repository
        run: |
          REPO_NAME="${{ env.TENANT }}/${{ env.APP_NAME }}"
          
          if aws ecr describe-repositories --repository-names "$REPO_NAME" 2>/dev/null; then
            echo "✅ ECR repository already exists: $REPO_NAME"
          else
            aws ecr create-repository --repository-name "$REPO_NAME"
            echo "✅ Created ECR repository: $REPO_NAME"
          fi

      - name: Update Kustomization Files
        run: |
          ACCOUNT_ID="${{ steps.aws.outputs.account_id }}"
          ECR_URI="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          
          # Update all kustomization files
          for ENV in dev qa staging; do
            KUST_FILE=".opsera-${{ env.APP_NAME }}/k8s/overlays/${ENV}/kustomization.yaml"
            if [ -f "$KUST_FILE" ]; then
              sed -i "s|\${AWS_ACCOUNT_ID}|${ACCOUNT_ID}|g" "$KUST_FILE"
              echo "✅ Updated ${KUST_FILE}"
            fi
          done

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit Changes
        run: |
          git add .opsera-${{ env.APP_NAME }}/
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Resolve ECR URI with AWS Account ID [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "✅ Changes committed"
          fi

      - name: Configure Hub Cluster
        run: |
          aws eks update-kubeconfig --name ${{ inputs.hub_cluster }} --region ${{ env.AWS_REGION }}

      - name: Create ArgoCD Repository Secret
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          REPO_URL="https://github.com/${{ github.repository }}.git"
          SECRET_NAME="repo-${{ env.APP_NAME }}"
          
          # Check if secret exists
          if kubectl get secret "$SECRET_NAME" -n argocd &>/dev/null; then
            echo "⚠️ Repository secret exists, updating..."
            kubectl delete secret "$SECRET_NAME" -n argocd
          fi
          
          # Create secret
          kubectl create secret generic "$SECRET_NAME" \
            --namespace argocd \
            --from-literal=type=git \
            --from-literal=url="$REPO_URL" \
            --from-literal=username=git \
            --from-literal=password="$GH_PAT"
          
          kubectl label secret "$SECRET_NAME" -n argocd \
            argocd.argoproj.io/secret-type=repository --overwrite
          
          echo "✅ ArgoCD repository secret created"

      - name: Verify Spoke Cluster Registration
        run: |
          if kubectl get secret "cluster-${{ inputs.spoke_cluster }}" -n argocd &>/dev/null; then
            echo "✅ Spoke cluster ${{ inputs.spoke_cluster }} is registered"
          else
            echo "❌ Spoke cluster ${{ inputs.spoke_cluster }} is NOT registered"
            echo "Please register the spoke cluster first"
            exit 1
          fi

      - name: Apply ArgoCD Applications
        run: |
          if [ "${{ inputs.environment }}" == "all" ]; then
            ENVS="dev qa staging"
          else
            ENVS="${{ inputs.environment }}"
          fi
          
          for ENV in $ENVS; do
            APP_FILE=".opsera-${{ env.APP_NAME }}/argocd/${ENV}/application.yaml"
            if [ -f "$APP_FILE" ]; then
              kubectl apply -f "$APP_FILE"
              echo "✅ Applied ArgoCD Application for ${ENV}"
            fi
          done

      - name: Wait for Initial Sync
        run: |
          APP_NAME="${{ env.APP_NAME }}-${{ inputs.environment }}"
          
          echo "Waiting for ArgoCD sync (max 5 minutes)..."
          
          for i in {1..30}; do
            SYNC=$(kubectl get application "$APP_NAME" -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "Unknown")
            HEALTH=$(kubectl get application "$APP_NAME" -n argocd -o jsonpath='{.status.health.status}' 2>/dev/null || echo "Unknown")
            
            echo "  [$i/30] Sync: $SYNC | Health: $HEALTH"
            
            if [ "$SYNC" == "Synced" ]; then
              echo "✅ Application synced!"
              break
            fi
            
            sleep 10
          done

      - name: Generate Summary
        run: |
          ACCOUNT_ID="${{ steps.aws.outputs.account_id }}"
          
          echo "# 🎉 GitOps Setup Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Configuration" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **App Name** | \`${{ env.APP_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **AWS Account** | \`${ACCOUNT_ID}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **ECR Repository** | \`${{ env.TENANT }}/${{ env.APP_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Hub Cluster** | \`${{ inputs.hub_cluster }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Spoke Cluster** | \`${{ inputs.spoke_cluster }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. **Build and push your Docker image:**" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "   docker build -t ${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.TENANT }}/${{ env.APP_NAME }}:latest -f .opsera-${{ env.APP_NAME }}/Dockerfile ." >> $GITHUB_STEP_SUMMARY
          echo "   aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_STEP_SUMMARY
          echo "   docker push ${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.TENANT }}/${{ env.APP_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "2. **ArgoCD will automatically sync the deployment!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Pure GitOps is now active. Any changes pushed to the repo will be automatically synced by ArgoCD.*" >> $GITHUB_STEP_SUMMARY
