# ════════════════════════════════════════════════════════════════════════════
# DELETE ENVIRONMENT WORKFLOW - event-demo-1
# Generated by Opsera Code-to-Cloud Enterprise v0.903
# RULE 114-117: Touchless environment management
# RULE 117: ECR is shared - NEVER delete on environment deletion
# ════════════════════════════════════════════════════════════════════════════

name: "➖ event-demo-1: Delete Environment"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to delete'
        required: true
        type: string
      confirm:
        description: 'Type DELETE to confirm'
        required: true
        type: string

env:
  APP_NAME: event-demo-1
  TENANT: opsera
  AWS_REGION: us-west-2
  HUB_CLUSTER: argocd-usw2
  SPOKE_CLUSTER: opsera-usw2-np

permissions:
  contents: write
  id-token: write

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # VALIDATE
  # ════════════════════════════════════════════════════════════════════════════
  validate:
    name: "✅ Validate"
    runs-on: ubuntu-latest
    steps:
      - name: Check Confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DELETE" ]; then
            echo "❌ Confirmation failed. Type 'DELETE' to confirm."
            exit 1
          fi
          
          # Prevent deletion of protected environments
          case "${{ inputs.environment }}" in
            prod|production)
              echo "❌ Cannot delete production environment via workflow"
              exit 1
              ;;
          esac
          
          echo "✅ Confirmation validated"

  # ════════════════════════════════════════════════════════════════════════════
  # DELETE ARGOCD APPLICATION
  # ════════════════════════════════════════════════════════════════════════════
  delete-argocd:
    name: "🗑️ Delete ArgoCD Application"
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for Hub
        run: |
          aws eks update-kubeconfig --name ${{ env.HUB_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Remove Finalizers and Delete Application
        run: |
          APP="${{ env.APP_NAME }}-${{ inputs.environment }}"
          
          # Check if application exists
          if ! kubectl get application "$APP" -n argocd 2>/dev/null; then
            echo "⚠️ ArgoCD application not found: $APP"
            exit 0
          fi
          
          # RULE 118: Remove finalizers to prevent stuck state
          kubectl patch application "$APP" -n argocd \
            --type=json \
            -p='[{"op": "remove", "path": "/metadata/finalizers"}]' 2>/dev/null || true
          
          # Delete application
          kubectl delete application "$APP" -n argocd --wait=false
          
          echo "✅ ArgoCD application deleted"

  # ════════════════════════════════════════════════════════════════════════════
  # DELETE NAMESPACE
  # ════════════════════════════════════════════════════════════════════════════
  delete-namespace:
    name: "🗑️ Delete Namespace"
    runs-on: ubuntu-latest
    needs: [delete-argocd]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for Spoke
        run: |
          aws eks update-kubeconfig --name ${{ env.SPOKE_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Delete Namespace
        run: |
          NAMESPACE="${{ env.TENANT }}-${{ env.APP_NAME }}-${{ inputs.environment }}"
          
          if kubectl get namespace "$NAMESPACE" 2>/dev/null; then
            kubectl delete namespace "$NAMESPACE" --wait=false
            echo "✅ Namespace deleted: $NAMESPACE"
          else
            echo "⚠️ Namespace not found: $NAMESPACE"
          fi

  # ════════════════════════════════════════════════════════════════════════════
  # DELETE FILES FROM REPOSITORY
  # ════════════════════════════════════════════════════════════════════════════
  delete-files:
    name: "📁 Delete Environment Files"
    runs-on: ubuntu-latest
    needs: [delete-namespace]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Delete Environment Files
        run: |
          ENV="${{ inputs.environment }}"
          
          # Delete K8s overlay
          if [ -d ".opsera-${{ env.APP_NAME }}/k8s/overlays/${ENV}" ]; then
            rm -rf ".opsera-${{ env.APP_NAME }}/k8s/overlays/${ENV}"
            echo "✅ Deleted overlay: ${ENV}"
          fi
          
          # Delete ArgoCD application
          if [ -d ".opsera-${{ env.APP_NAME }}/argocd/${ENV}" ]; then
            rm -rf ".opsera-${{ env.APP_NAME }}/argocd/${ENV}"
            echo "✅ Deleted ArgoCD app: ${ENV}"
          fi

      - name: Commit and Push
        run: |
          ENV="${{ inputs.environment }}"
          
          git add -A
          
          if git diff --cached --quiet; then
            echo "No files to delete"
          else
            git commit -m "chore: Delete ${ENV} environment for ${{ env.APP_NAME }} [skip ci]

Deleted:
- K8s overlay
- ArgoCD application

RULE 117: ECR repository preserved (shared across environments)

Co-Authored-By: Opsera Code-to-Cloud <noreply@opsera.io>"
            
            git pull --rebase origin main
            git push origin main
            
            echo "✅ Files deleted and committed"
          fi

  # ════════════════════════════════════════════════════════════════════════════
  # SUMMARY
  # ════════════════════════════════════════════════════════════════════════════
  summary:
    name: "📋 Summary"
    runs-on: ubuntu-latest
    needs: [validate, delete-argocd, delete-namespace, delete-files]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          # ➖ Environment Deleted: ${{ inputs.environment }}

          ## Deleted Resources
          | Resource | Status |
          |----------|--------|
          | ArgoCD Application | ${{ needs.delete-argocd.result }} |
          | Kubernetes Namespace | ${{ needs.delete-namespace.result }} |
          | Repository Files | ${{ needs.delete-files.result }} |

          ## Preserved Resources
          - ✅ ECR Repository (shared across environments) - RULE 117

          ---
          *Generated by Opsera Code-to-Cloud Enterprise v0.903*
          EOF
