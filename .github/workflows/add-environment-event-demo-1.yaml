# ════════════════════════════════════════════════════════════════════════════
# ADD ENVIRONMENT WORKFLOW - event-demo-1
# Generated by Opsera Code-to-Cloud Enterprise v0.903
# RULE 114-117: Touchless environment management
# ════════════════════════════════════════════════════════════════════════════

name: "➕ event-demo-1: Add Environment"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'New environment name (e.g., qa2, labs1, uat)'
        required: true
        type: string
      replicas:
        description: 'Number of replicas'
        type: string
        default: '1'

env:
  APP_NAME: event-demo-1
  TENANT: opsera
  AWS_REGION: us-west-2
  DOMAIN: agent.opsera.dev
  HUB_CLUSTER: argocd-usw2
  SPOKE_CLUSTER: opsera-usw2-np

permissions:
  contents: write
  id-token: write

jobs:
  create-environment:
    name: "📁 Create Environment Files"
    runs-on: ubuntu-latest
    outputs:
      namespace: ${{ steps.create.outputs.namespace }}
      subdomain: ${{ steps.create.outputs.subdomain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID
        id: aws
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT

      - name: Create Environment Files
        id: create
        env:
          NEW_ENV: ${{ inputs.environment }}
          REPLICAS: ${{ inputs.replicas }}
          ACCOUNT_ID: ${{ steps.aws.outputs.account_id }}
        run: |
          NAMESPACE="${{ env.TENANT }}-${{ env.APP_NAME }}-${NEW_ENV}"
          SUBDOMAIN="${{ env.TENANT }}-${{ env.APP_NAME }}-${NEW_ENV}.${{ env.DOMAIN }}"
          ECR_URI="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          REPO_URL="https://github.com/${{ github.repository }}"
          
          echo "namespace=${NAMESPACE}" >> $GITHUB_OUTPUT
          echo "subdomain=${SUBDOMAIN}" >> $GITHUB_OUTPUT
          
          if [ -d ".opsera-${{ env.APP_NAME }}/k8s/overlays/${NEW_ENV}" ]; then
            echo "❌ Environment ${NEW_ENV} already exists"
            exit 1
          fi
          
          mkdir -p ".opsera-${{ env.APP_NAME }}/k8s/overlays/${NEW_ENV}"
          mkdir -p ".opsera-${{ env.APP_NAME }}/argocd/${NEW_ENV}"
          
          # Create namespace.yaml
          cat > ".opsera-${{ env.APP_NAME }}/k8s/overlays/${NEW_ENV}/namespace.yaml" <<NSEOF
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ${NAMESPACE}
            labels:
              app: ${{ env.APP_NAME }}
              environment: ${NEW_ENV}
              tenant: ${{ env.TENANT }}
          NSEOF
          sed -i 's/^          //' ".opsera-${{ env.APP_NAME }}/k8s/overlays/${NEW_ENV}/namespace.yaml"
          
          # Create kustomization.yaml
          cat > ".opsera-${{ env.APP_NAME }}/k8s/overlays/${NEW_ENV}/kustomization.yaml" <<KUSTEOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          namespace: ${NAMESPACE}
          resources:
            - ../../base
            - namespace.yaml
          commonLabels:
            environment: ${NEW_ENV}
          images:
            - name: ${{ env.APP_NAME }}
              newName: ${ECR_URI}/${{ env.TENANT }}/${{ env.APP_NAME }}
              newTag: latest
          KUSTEOF
          sed -i 's/^          //' ".opsera-${{ env.APP_NAME }}/k8s/overlays/${NEW_ENV}/kustomization.yaml"
          
          # Create ArgoCD application.yaml
          cat > ".opsera-${{ env.APP_NAME }}/argocd/${NEW_ENV}/application.yaml" <<ARGOEOF
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: ${{ env.APP_NAME }}-${NEW_ENV}
            namespace: argocd
            labels:
              app: ${{ env.APP_NAME }}
              environment: ${NEW_ENV}
              tenant: ${{ env.TENANT }}
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: default
            source:
              repoURL: ${REPO_URL}
              targetRevision: HEAD
              path: .opsera-${{ env.APP_NAME }}/k8s/overlays/${NEW_ENV}
            destination:
              name: ${{ env.SPOKE_CLUSTER }}
              namespace: ${NAMESPACE}
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
                - PruneLast=true
              retry:
                limit: 5
                backoff:
                  duration: 5s
                  factor: 2
                  maxDuration: 3m
          ARGOEOF
          sed -i 's/^          //' ".opsera-${{ env.APP_NAME }}/argocd/${NEW_ENV}/application.yaml"
          
          echo "✅ Environment files created"

      - name: Commit and Push
        env:
          NEW_ENV: ${{ inputs.environment }}
        run: |
          git add ".opsera-${{ env.APP_NAME }}/k8s/overlays/${NEW_ENV}/"
          git add ".opsera-${{ env.APP_NAME }}/argocd/${NEW_ENV}/"
          
          git commit -m "feat: Add ${NEW_ENV} environment for ${{ env.APP_NAME }} [skip ci]" \
            -m "Namespace: ${{ steps.create.outputs.namespace }}" \
            -m "URL: https://${{ steps.create.outputs.subdomain }}" \
            -m "Co-Authored-By: Opsera Code-to-Cloud <noreply@opsera.io>"
          
          git pull --rebase origin main
          git push origin main
          
          echo "✅ Changes committed"

  apply-argocd:
    name: "🚀 Apply ArgoCD Application"
    runs-on: ubuntu-latest
    needs: [create-environment]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ${{ env.HUB_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Pull Latest and Apply
        env:
          NEW_ENV: ${{ inputs.environment }}
        run: |
          git pull origin main
          
          APP_FILE=".opsera-${{ env.APP_NAME }}/argocd/${NEW_ENV}/application.yaml"
          
          kubectl apply -f "$APP_FILE"
          echo "✅ ArgoCD Application applied"
          
          sleep 5
          kubectl annotate application "${{ env.APP_NAME }}-${NEW_ENV}" -n argocd \
            argocd.argoproj.io/refresh=hard --overwrite || true

  summary:
    name: "📋 Summary"
    runs-on: ubuntu-latest
    needs: [create-environment, apply-argocd]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "# ➕ Environment Added: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Configuration" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Namespace** | \`${{ needs.create-environment.outputs.namespace }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Replicas** | \`${{ inputs.replicas }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Application URL" >> $GITHUB_STEP_SUMMARY
          echo "https://${{ needs.create-environment.outputs.subdomain }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Wait for ArgoCD to sync" >> $GITHUB_STEP_SUMMARY
          echo "2. Deploy using: gh workflow run ci-build-push-${{ env.APP_NAME }}.yaml -f environment=${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Generated by Opsera Code-to-Cloud Enterprise v0.903*" >> $GITHUB_STEP_SUMMARY
