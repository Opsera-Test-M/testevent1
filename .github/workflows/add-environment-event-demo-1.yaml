# ════════════════════════════════════════════════════════════════════════════
# ADD ENVIRONMENT WORKFLOW - event-demo-1
# Generated by Opsera Code-to-Cloud Enterprise v0.903
# RULE 114-117: Touchless environment management
# ════════════════════════════════════════════════════════════════════════════

name: "➕ event-demo-1: Add Environment"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'New environment name (e.g., qa2, labs1, uat)'
        required: true
        type: string
      replicas:
        description: 'Number of replicas'
        type: string
        default: '1'

env:
  APP_NAME: event-demo-1
  TENANT: opsera
  AWS_REGION: us-west-2
  DOMAIN: agent.opsera.dev
  HUB_CLUSTER: argocd-usw2
  SPOKE_CLUSTER: opsera-usw2-np

permissions:
  contents: write
  id-token: write

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # CREATE ENVIRONMENT FILES
  # ════════════════════════════════════════════════════════════════════════════
  create-environment:
    name: "📁 Create Environment Files"
    runs-on: ubuntu-latest
    outputs:
      namespace: ${{ steps.create.outputs.namespace }}
      subdomain: ${{ steps.create.outputs.subdomain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID
        id: aws
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT

      - name: Create Environment Files
        id: create
        run: |
          ENV="${{ inputs.environment }}"
          NAMESPACE="${{ env.TENANT }}-${{ env.APP_NAME }}-${ENV}"
          SUBDOMAIN="${{ env.TENANT }}-${{ env.APP_NAME }}-${ENV}.${{ env.DOMAIN }}"
          ECR_URI="${{ steps.aws.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          REPO_URL="https://github.com/${{ github.repository }}"
          
          echo "namespace=${NAMESPACE}" >> $GITHUB_OUTPUT
          echo "subdomain=${SUBDOMAIN}" >> $GITHUB_OUTPUT
          
          # Check if environment already exists
          if [ -d ".opsera-${{ env.APP_NAME }}/k8s/overlays/${ENV}" ]; then
            echo "❌ Environment ${ENV} already exists"
            exit 1
          fi
          
          # Create overlay directory
          mkdir -p ".opsera-${{ env.APP_NAME }}/k8s/overlays/${ENV}"
          
          # Create namespace.yaml
          cat > ".opsera-${{ env.APP_NAME }}/k8s/overlays/${ENV}/namespace.yaml" << EOF
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ${NAMESPACE}
            labels:
              app: ${{ env.APP_NAME }}
              environment: ${ENV}
              tenant: ${{ env.TENANT }}
          EOF
          
          # Create kustomization.yaml
          cat > ".opsera-${{ env.APP_NAME }}/k8s/overlays/${ENV}/kustomization.yaml" << EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          
          namespace: ${NAMESPACE}
          
          resources:
            - ../../base
            - namespace.yaml
          
          commonLabels:
            environment: ${ENV}
          
          images:
            - name: ${{ env.APP_NAME }}
              newName: ${ECR_URI}/${{ env.TENANT }}/${{ env.APP_NAME }}
              newTag: latest
          
          patches:
            - target:
                kind: Ingress
                name: ${{ env.APP_NAME }}
              patch: |-
                - op: replace
                  path: /spec/rules/0/host
                  value: ${SUBDOMAIN}
            - target:
                kind: Deployment
                name: ${{ env.APP_NAME }}
              patch: |-
                - op: replace
                  path: /spec/replicas
                  value: ${{ inputs.replicas }}
          EOF
          
          # Create ArgoCD application directory
          mkdir -p ".opsera-${{ env.APP_NAME }}/argocd/${ENV}"
          
          # Create ArgoCD application.yaml
          cat > ".opsera-${{ env.APP_NAME }}/argocd/${ENV}/application.yaml" << EOF
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: ${{ env.APP_NAME }}-${ENV}
            namespace: argocd
            labels:
              app: ${{ env.APP_NAME }}
              environment: ${ENV}
              tenant: ${{ env.TENANT }}
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: default
            source:
              repoURL: ${REPO_URL}
              targetRevision: HEAD
              path: .opsera-${{ env.APP_NAME }}/k8s/overlays/${ENV}
            destination:
              name: ${{ env.SPOKE_CLUSTER }}
              namespace: ${NAMESPACE}
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
                - PruneLast=true
              retry:
                limit: 5
                backoff:
                  duration: 5s
                  factor: 2
                  maxDuration: 3m
          EOF
          
          echo "✅ Environment files created"

      - name: Commit and Push
        run: |
          ENV="${{ inputs.environment }}"
          
          git add ".opsera-${{ env.APP_NAME }}/k8s/overlays/${ENV}/"
          git add ".opsera-${{ env.APP_NAME }}/argocd/${ENV}/"
          
          git commit -m "feat: Add ${ENV} environment for ${{ env.APP_NAME }} [skip ci]

Environment: ${ENV}
Namespace: ${{ steps.create.outputs.namespace }}
URL: https://${{ steps.create.outputs.subdomain }}

Co-Authored-By: Opsera Code-to-Cloud <noreply@opsera.io>"
          
          git pull --rebase origin main
          git push origin main
          
          echo "✅ Changes committed"

  # ════════════════════════════════════════════════════════════════════════════
  # APPLY ARGOCD APPLICATION
  # ════════════════════════════════════════════════════════════════════════════
  apply-argocd:
    name: "🚀 Apply ArgoCD Application"
    runs-on: ubuntu-latest
    needs: [create-environment]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ${{ env.HUB_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Pull Latest and Apply
        run: |
          git pull origin main
          
          ENV="${{ inputs.environment }}"
          APP_FILE=".opsera-${{ env.APP_NAME }}/argocd/${ENV}/application.yaml"
          
          kubectl apply -f "$APP_FILE"
          echo "✅ ArgoCD Application applied"
          
          sleep 5
          kubectl annotate application "${{ env.APP_NAME }}-${ENV}" -n argocd \
            argocd.argoproj.io/refresh=hard --overwrite || true

  # ════════════════════════════════════════════════════════════════════════════
  # SUMMARY
  # ════════════════════════════════════════════════════════════════════════════
  summary:
    name: "📋 Summary"
    runs-on: ubuntu-latest
    needs: [create-environment, apply-argocd]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          # ➕ Environment Added: ${{ inputs.environment }}

          ## Configuration
          | Setting | Value |
          |---------|-------|
          | **Environment** | \`${{ inputs.environment }}\` |
          | **Namespace** | \`${{ needs.create-environment.outputs.namespace }}\` |
          | **Replicas** | \`${{ inputs.replicas }}\` |

          ## Application URL
          \`\`\`
          https://${{ needs.create-environment.outputs.subdomain }}
          \`\`\`

          ## Next Steps
          1. Wait for ArgoCD to sync
          2. Deploy using:
             \`\`\`bash
             gh workflow run ci-build-push-${{ env.APP_NAME }}.yaml -f environment=${{ inputs.environment }}
             \`\`\`

          ---
          *Generated by Opsera Code-to-Cloud Enterprise v0.903*
          EOF
