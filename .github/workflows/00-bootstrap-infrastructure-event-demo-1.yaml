# ════════════════════════════════════════════════════════════════════════════
# BOOTSTRAP INFRASTRUCTURE - event-demo-1
# Generated by Opsera Code-to-Cloud Enterprise v0.903
# Run this FIRST before CI/CD workflow
# ════════════════════════════════════════════════════════════════════════════

name: "🏗️ event-demo-1: Bootstrap Infrastructure"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: string
        default: 'dev'
      spoke_cluster:
        description: 'Spoke cluster name (where app deploys)'
        required: true
        type: string
        default: 'opsera-usw2-np'
      hub_cluster:
        description: 'Hub cluster name (where ArgoCD runs)'
        required: true
        type: string
        default: 'argocd-usw2'
      proceed:
        description: 'Confirm bootstrap'
        type: boolean
        default: false
        required: true

env:
  APP_NAME: event-demo-1
  TENANT: opsera
  AWS_REGION: us-west-2
  DOMAIN: agent.opsera.dev

permissions:
  contents: write
  id-token: write

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # VALIDATE PREREQUISITES
  # ════════════════════════════════════════════════════════════════════════════
  validate:
    name: "✅ Validate Prerequisites"
    runs-on: ubuntu-latest
    if: inputs.proceed == true
    outputs:
      ecr_exists: ${{ steps.check-ecr.outputs.exists }}
      spoke_exists: ${{ steps.check-spoke.outputs.exists }}
      account_id: ${{ steps.get-account.outputs.account_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # RULE 7: Get AWS Account ID dynamically
      - name: Get AWS Account ID
        id: get-account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT
          echo "✅ AWS Account: ${ACCOUNT_ID}"

      # RULE 90: Verify infrastructure via direct API calls
      - name: Check ECR Repository
        id: check-ecr
        run: |
          ECR_REPO="${{ env.TENANT }}/${{ env.APP_NAME }}"
          if aws ecr describe-repositories --repository-names "$ECR_REPO" 2>/dev/null; then
            echo "✅ ECR repository exists: $ECR_REPO"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "📝 ECR repository will be created: $ECR_REPO"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # RULE 90: Verify spoke cluster exists
      - name: Check Spoke Cluster
        id: check-spoke
        run: |
          if aws eks describe-cluster --name "${{ inputs.spoke_cluster }}" 2>/dev/null; then
            echo "✅ Spoke cluster exists: ${{ inputs.spoke_cluster }}"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Spoke cluster not found: ${{ inputs.spoke_cluster }}"
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::error::Spoke cluster ${{ inputs.spoke_cluster }} does not exist. Create it first."
            exit 1
          fi

  # ════════════════════════════════════════════════════════════════════════════
  # CREATE ECR REPOSITORY
  # ════════════════════════════════════════════════════════════════════════════
  create-ecr:
    name: "📦 Create ECR Repository"
    runs-on: ubuntu-latest
    needs: [validate]
    if: needs.validate.outputs.ecr_exists == 'false'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create ECR Repository
        run: |
          # RULE 101: ECR repos use {tenant}/{app} pattern
          ECR_REPO="${{ env.TENANT }}/${{ env.APP_NAME }}"
          
          aws ecr create-repository \
            --repository-name "$ECR_REPO" \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256 \
            --tags Key=tenant,Value=${{ env.TENANT }} Key=app,Value=${{ env.APP_NAME }}
          
          echo "✅ ECR repository created: $ECR_REPO"

  # ════════════════════════════════════════════════════════════════════════════
  # REGISTER SPOKE WITH ARGOCD HUB
  # ════════════════════════════════════════════════════════════════════════════
  register-spoke:
    name: "🔗 Register Spoke with ArgoCD"
    runs-on: ubuntu-latest
    needs: [validate, create-ecr]
    if: always() && needs.validate.result == 'success' && (needs.create-ecr.result == 'success' || needs.create-ecr.result == 'skipped')
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for Hub
        run: |
          aws eks update-kubeconfig --name ${{ inputs.hub_cluster }} --region ${{ env.AWS_REGION }} --alias hub

      # RULE 103: Check if spoke already registered
      - name: Check Spoke Registration
        id: check-registration
        run: |
          if kubectl get secret "cluster-${{ inputs.spoke_cluster }}" -n argocd 2>/dev/null; then
            echo "✅ Spoke already registered with ArgoCD"
            echo "registered=true" >> $GITHUB_OUTPUT
          else
            echo "📝 Spoke needs registration"
            echo "registered=false" >> $GITHUB_OUTPUT
          fi

      - name: Register Spoke Cluster
        if: steps.check-registration.outputs.registered == 'false'
        run: |
          # Get spoke cluster info
          SPOKE_ENDPOINT=$(aws eks describe-cluster --name ${{ inputs.spoke_cluster }} \
            --query 'cluster.endpoint' --output text)
          SPOKE_CA=$(aws eks describe-cluster --name ${{ inputs.spoke_cluster }} \
            --query 'cluster.certificateAuthority.data' --output text)

          # Configure kubectl for spoke to create service account
          aws eks update-kubeconfig --name ${{ inputs.spoke_cluster }} --region ${{ env.AWS_REGION }} --alias spoke
          kubectl config use-context spoke

          # Create ArgoCD manager service account on spoke
          kubectl create serviceaccount argocd-manager -n kube-system --dry-run=client -o yaml | kubectl apply -f -
          
          # Create cluster role binding
          kubectl create clusterrolebinding argocd-manager \
            --clusterrole=cluster-admin \
            --serviceaccount=kube-system:argocd-manager \
            --dry-run=client -o yaml | kubectl apply -f -

          # RULE 62: Create token for K8s 1.24+
          TOKEN=$(kubectl create token argocd-manager -n kube-system --duration=87600h)

          # Switch to hub cluster
          kubectl config use-context hub

          # Create cluster secret in ArgoCD
          kubectl create secret generic "cluster-${{ inputs.spoke_cluster }}" \
            --namespace=argocd \
            --from-literal="name=${{ inputs.spoke_cluster }}" \
            --from-literal="server=${SPOKE_ENDPOINT}" \
            --from-literal="config={\"bearerToken\": \"${TOKEN}\", \"tlsClientConfig\": {\"insecure\": false, \"caData\": \"${SPOKE_CA}\"}}" \
            --dry-run=client -o yaml | kubectl apply -f -
          
          kubectl label secret "cluster-${{ inputs.spoke_cluster }}" -n argocd \
            argocd.argoproj.io/secret-type=cluster --overwrite

          echo "✅ Spoke cluster registered with ArgoCD"

  # ════════════════════════════════════════════════════════════════════════════
  # CREATE ARGOCD REPOSITORY SECRET
  # ════════════════════════════════════════════════════════════════════════════
  create-repo-secret:
    name: "🔐 Create ArgoCD Repo Secret"
    runs-on: ubuntu-latest
    needs: [register-spoke]
    if: always() && needs.register-spoke.result == 'success' || needs.register-spoke.result == 'skipped'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for Hub
        run: |
          aws eks update-kubeconfig --name ${{ inputs.hub_cluster }} --region ${{ env.AWS_REGION }}

      # RULE 63: Create repository secret with GH_PAT
      - name: Create Repository Secret
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "❌ GH_PAT secret not configured"
            exit 1
          fi

          SECRET_NAME="repo-${{ env.APP_NAME }}"
          REPO_URL="https://github.com/${{ github.repository }}"

          # Check if secret exists
          if kubectl get secret "$SECRET_NAME" -n argocd 2>/dev/null; then
            echo "✅ Repository secret already exists"
          else
            kubectl create secret generic "$SECRET_NAME" -n argocd \
              --from-literal=type=git \
              --from-literal=url="$REPO_URL" \
              --from-literal=username=git \
              --from-literal=password="$GH_PAT"
            
            kubectl label secret "$SECRET_NAME" -n argocd \
              argocd.argoproj.io/secret-type=repository
            
            echo "✅ Repository secret created"
          fi

  # ════════════════════════════════════════════════════════════════════════════
  # UPDATE MANIFESTS WITH RESOLVED VALUES
  # ════════════════════════════════════════════════════════════════════════════
  update-manifests:
    name: "📝 Update Manifests"
    runs-on: ubuntu-latest
    needs: [validate, create-repo-secret]
    if: always() && needs.validate.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # RULE 58: Resolve all placeholders before commit
      - name: Resolve Placeholders
        run: |
          ACCOUNT_ID="${{ needs.validate.outputs.account_id }}"
          ECR_URI="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          REPO_URL="https://github.com/${{ github.repository }}"
          SPOKE_CLUSTER="${{ inputs.spoke_cluster }}"
          ENV="${{ inputs.environment }}"
          SUBDOMAIN="${{ env.TENANT }}-${{ env.APP_NAME }}-${ENV}.${{ env.DOMAIN }}"

          echo "Resolving placeholders..."
          echo "  ECR_URI: $ECR_URI"
          echo "  REPO_URL: $REPO_URL"
          echo "  SPOKE_CLUSTER: $SPOKE_CLUSTER"
          echo "  SUBDOMAIN: $SUBDOMAIN"

          # Update kustomization files
          find .opsera-${{ env.APP_NAME }}/k8s/overlays -name "kustomization.yaml" -exec \
            sed -i "s|PLACEHOLDER_ECR_URI|${ECR_URI}|g" {} \;

          # Update ArgoCD applications
          find .opsera-${{ env.APP_NAME }}/argocd -name "application.yaml" -exec \
            sed -i "s|PLACEHOLDER_REPO_URL|${REPO_URL}|g" {} \;
          find .opsera-${{ env.APP_NAME }}/argocd -name "application.yaml" -exec \
            sed -i "s|PLACEHOLDER_SPOKE_CLUSTER|${SPOKE_CLUSTER}|g" {} \;

          # Update Ingress host (base)
          sed -i "s|PLACEHOLDER_SUBDOMAIN|${SUBDOMAIN}|g" .opsera-${{ env.APP_NAME }}/k8s/base/ingress.yaml

          echo "✅ All placeholders resolved"

      - name: Commit Changes
        run: |
          git add .opsera-${{ env.APP_NAME }}/
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Bootstrap ${{ env.APP_NAME }} for ${{ inputs.environment }} [skip ci]" \
              -m "Resolved placeholders: ECR URI, spoke cluster (${{ inputs.spoke_cluster }}), repo URL" \
              -m "Co-Authored-By: Opsera Code-to-Cloud <noreply@opsera.io>"
            
            git pull --rebase origin main
            git push origin main
            echo "✅ Changes committed"
          fi

  # ════════════════════════════════════════════════════════════════════════════
  # APPLY ARGOCD APPLICATION
  # ════════════════════════════════════════════════════════════════════════════
  apply-argocd:
    name: "🚀 Apply ArgoCD Application"
    runs-on: ubuntu-latest
    needs: [update-manifests, create-repo-secret]
    if: always() && needs.update-manifests.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # Get latest after manifest updates

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for Hub
        run: |
          aws eks update-kubeconfig --name ${{ inputs.hub_cluster }} --region ${{ env.AWS_REGION }}

      - name: Apply ArgoCD Application
        run: |
          APP_FILE=".opsera-${{ env.APP_NAME }}/argocd/${{ inputs.environment }}/application.yaml"
          
          if [ -f "$APP_FILE" ]; then
            # Pull latest changes
            git pull origin main
            
            kubectl apply -f "$APP_FILE"
            echo "✅ ArgoCD Application applied for ${{ inputs.environment }}"
          else
            echo "❌ Application file not found: $APP_FILE"
            exit 1
          fi

      # RULE 66: Force ArgoCD sync
      - name: Force ArgoCD Sync
        run: |
          APP_NAME="${{ env.APP_NAME }}-${{ inputs.environment }}"
          
          sleep 5
          kubectl annotate application "$APP_NAME" -n argocd \
            argocd.argoproj.io/refresh=hard --overwrite || true
          
          echo "✅ ArgoCD sync triggered"

  # ════════════════════════════════════════════════════════════════════════════
  # SUMMARY
  # ════════════════════════════════════════════════════════════════════════════
  summary:
    name: "📋 Bootstrap Summary"
    runs-on: ubuntu-latest
    needs: [validate, create-ecr, register-spoke, create-repo-secret, update-manifests, apply-argocd]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "# 🏗️ Bootstrap Complete: ${{ env.APP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Configuration" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **App Name** | \`${{ env.APP_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tenant** | \`${{ env.TENANT }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Spoke Cluster** | \`${{ inputs.spoke_cluster }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Hub Cluster** | \`${{ inputs.hub_cluster }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Region** | \`${{ env.AWS_REGION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validate | ${{ needs.validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Create ECR | ${{ needs.create-ecr.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Register Spoke | ${{ needs.register-spoke.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Create Repo Secret | ${{ needs.create-repo-secret.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Update Manifests | ${{ needs.update-manifests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Apply ArgoCD | ${{ needs.apply-argocd.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Push code to main to trigger CI/CD" >> $GITHUB_STEP_SUMMARY
          echo "2. Monitor ArgoCD for deployment status" >> $GITHUB_STEP_SUMMARY
          echo "3. Access your app at: https://${{ env.TENANT }}-${{ env.APP_NAME }}-${{ inputs.environment }}.${{ env.DOMAIN }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Generated by Opsera Code-to-Cloud Enterprise v0.903*" >> $GITHUB_STEP_SUMMARY
