# ════════════════════════════════════════════════════════════════════════════
# GITOPS BUILD WORKFLOW
# Generated by Opsera Code-to-Cloud Enterprise v0.903
# 
# Pure GitOps approach:
# - This workflow ONLY builds and pushes Docker image
# - Updates image tag in kustomization
# - ArgoCD automatically syncs the deployment
#
# No kubectl commands, no deployment logic - just build!
# ════════════════════════════════════════════════════════════════════════════

name: "🔨 event-demo-1: Build & Push (GitOps)"

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - '.opsera-event-demo-1/Dockerfile'
      - '.opsera-event-demo-1/nginx.conf'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - dev
          - qa
          - staging
        default: dev

env:
  APP_NAME: event-demo-1
  TENANT: opsera
  AWS_REGION: us-west-2

permissions:
  contents: write
  id-token: write

jobs:
  build-and-push:
    name: "🔨 Build & Push"
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      ecr_uri: ${{ steps.ecr.outputs.uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR URI
        id: ecr
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URI="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.TENANT }}/${{ env.APP_NAME }}"
          echo "uri=${ECR_URI}" >> $GITHUB_OUTPUT
          echo "account_id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin \
            ${{ steps.ecr.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Generate Image Tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          TAG="${SHORT_SHA}-${TIMESTAMP}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "📦 Image Tag: ${TAG}"

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ steps.ecr.outputs.uri }}:${{ steps.tag.outputs.tag }} \
            -t ${{ steps.ecr.outputs.uri }}:latest \
            -f .opsera-${{ env.APP_NAME }}/Dockerfile \
            .

      - name: Push Docker Image
        run: |
          docker push ${{ steps.ecr.outputs.uri }}:${{ steps.tag.outputs.tag }}
          docker push ${{ steps.ecr.outputs.uri }}:latest
          echo "✅ Pushed image: ${{ steps.ecr.outputs.uri }}:${{ steps.tag.outputs.tag }}"

  update-manifests:
    name: "📝 Update Manifests"
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Determine Environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          else
            ENV="dev"
          fi
          echo "environment=${ENV}" >> $GITHUB_OUTPUT

      - name: Update Kustomization
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          TAG="${{ needs.build-and-push.outputs.image_tag }}"
          KUST_FILE=".opsera-${{ env.APP_NAME }}/k8s/overlays/${ENV}/kustomization.yaml"
          
          # Update the newTag in kustomization
          sed -i "s/newTag: .*/newTag: ${TAG}/" "$KUST_FILE"
          
          echo "✅ Updated ${KUST_FILE} with tag: ${TAG}"
          cat "$KUST_FILE"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          TAG="${{ needs.build-and-push.outputs.image_tag }}"
          
          git add .opsera-${{ env.APP_NAME }}/k8s/overlays/${ENV}/kustomization.yaml
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "deploy(${ENV}): Update image to ${TAG} [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "✅ Committed image tag update"
          fi

      - name: Summary
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          TAG="${{ needs.build-and-push.outputs.image_tag }}"
          ECR="${{ needs.build-and-push.outputs.ecr_uri }}"
          
          echo "# 🚀 GitOps Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Image Details" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${ECR}:${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${ENV}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ArgoCD Auto-Sync" >> $GITHUB_STEP_SUMMARY
          echo "ArgoCD will automatically detect the manifest change and deploy the new image." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check ArgoCD UI or run:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "kubectl get application ${{ env.APP_NAME }}-${ENV} -n argocd" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
