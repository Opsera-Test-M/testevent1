# ════════════════════════════════════════════════════════════════════════════
# KUSTOMIZATION - Staging Environment Overlay
# Generated by Opsera Code-to-Cloud Enterprise v0.903
# Deployment Strategy: Blue-Green (instant rollback)
# ════════════════════════════════════════════════════════════════════════════
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opsera-event-demo-1-staging

resources:
  - ../../base
  - namespace.yaml

commonLabels:
  environment: staging

# Image configuration - will be updated by CI/CD
images:
  - name: event-demo-1
    # Format: {aws_account_id}.dkr.ecr.{region}.amazonaws.com/{tenant}/{app}
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.us-west-2.amazonaws.com/opsera/event-demo-1
    newTag: latest

# Patches for staging-specific configuration
patches:
  # Update Ingress host for staging environment
  - target:
      kind: Ingress
      name: event-demo-1
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: opsera-event-demo-1-staging.agent.opsera.dev
  
  # Staging environment: 3 replicas
  - target:
      kind: Deployment
      name: event-demo-1
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
