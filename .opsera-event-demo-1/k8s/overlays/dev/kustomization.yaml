# KUSTOMIZATION - DEV Environment Overlay
# Generated by Opsera Code-to-Cloud Enterprise v0.903
# Deployment Strategy: Rolling (fast iteration)
# ════════════════════════════════════════════════════════════════════════════
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opsera-event-demo-1-dev

resources:
  - ../../base
  - namespace.yaml

commonLabels:
  environment: dev

# Image configuration - will be updated by CI/CD
images:
  - name: event-demo-1
    # Format: {aws_account_id}.dkr.ecr.{region}.amazonaws.com/{tenant}/{app}
    # Replace AWS_ACCOUNT_ID with your actual account ID
    newName: 792373136340.dkr.ecr.us-west-2.amazonaws.com/opsera/event-demo-1
    newTag: latest

# Patches for dev-specific configuration
patches:
  # Update Ingress host for dev environment
  - target:
      kind: Ingress
      name: event-demo-1
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: opsera-event-demo-1-dev.agent.opsera.dev
  
  # Dev environment: 1 replica
  - target:
      kind: Deployment
      name: event-demo-1
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
