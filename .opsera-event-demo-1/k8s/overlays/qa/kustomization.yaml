apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opsera-event-demo-1-qa

resources:
  - ../../base
  - namespace.yaml

commonLabels:
  environment: qa

# Image configuration - will be updated by CI/CD
images:
  - name: event-demo-1
    newName: PLACEHOLDER_ECR_URI/opsera/event-demo-1
    newTag: latest

# Patches for qa-specific configuration
patches:
  # Update Ingress host for qa environment
  - target:
      kind: Ingress
      name: event-demo-1
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: opsera-event-demo-1-qa.agent.opsera.dev
  
  # QA environment: 2 replicas
  - target:
      kind: Deployment
      name: event-demo-1
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
