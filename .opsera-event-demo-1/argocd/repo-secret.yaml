# ════════════════════════════════════════════════════════════════════════════
# ARGOCD REPOSITORY SECRET
# This secret allows ArgoCD to access the private GitHub repository
# RULE 63: ArgoCD requires repository credentials for private repos
# ════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: repo-event-demo-1
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/Opsera-Test-M/testevent1.git
  username: git
  # Replace with your GitHub Personal Access Token
  password: ${GH_PAT}
